version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      time: '03:30'
      timezone: 'Europe/Rome'
      interval: 'daily'
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    commit-message:
      prefix: '⬆️ chore'
      include: 'scope'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@types/react'
          - '@types/react-dom'
      vite:
        patterns:
          - 'vite'
          - 'vite-*'
          - '@vitejs/*'
      tests:
        patterns:
          - 'vitest'
          - '@vitest*'
          - '@testing-library/*'
          - 'jsdom'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint*'
          - '@typescript-eslint*'
          - 'prettier'
      mui:
        patterns:
          - '@mui/material'
          - '@mui/icons-material'
          - '@emotion/*'
      lodash:
        patterns:
          - 'lodash*'
          - '@types/lodash*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      time: '04:00'
      timezone: 'Europe/Rome'
      interval: 'weekly'
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: '⬆️ chore'
      include: 'scope'

